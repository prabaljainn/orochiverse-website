name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble public site into dist/
        run: |
          set -euo pipefail
          mkdir -p dist
          # Public, deployable files only — anything not listed here
          # (project/, README.md, DEPLOY.md, .github/, etc.) is intentionally
          # excluded so we don't ship the design bundle or internal docs.
          cp index.html              dist/
          cp manifest.webmanifest    dist/
          cp robots.txt              dist/
          cp sitemap.xml             dist/
          cp humans.txt              dist/
          cp CNAME                   dist/
          cp .nojekyll               dist/
          cp -R assets               dist/
          cp -R .well-known          dist/
          echo "── dist/ contents ─────────────────────"
          find dist -maxdepth 2 -print | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
